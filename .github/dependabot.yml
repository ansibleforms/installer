version: 2

# Keeps the Go modules and the workflow actions up to date. Updates are never grouped: every
# dependency gets its own pull request, so each one can be reviewed and reverted on its own.
#
# Major versions are proposed too, read against their changelog before merging. A Go module's
# major is a new import path, which Dependabot does not propose: that one stays by hand.
#
# Commit prefixes follow Conventional Commits: build for the Go modules built into the
# installer, ci for the workflow actions.

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
