name: Follow app release

# Keeps the installer on par with AnsibleForms. When the app releases, its release workflow
# sends an app-release repository_dispatch here with the tag. This workflow finds the
# installer line of that major version (main for the current major, release/<major>.x for a
# maintenance line), moves version.App in internal/version/version.go (the AnsibleForms
# version the installer installs by default, and the installer's own version) to the release,
# turns the changelog's Unreleased section into the release's entry and opens a pull request
# with auto-merge on.
#
# Nothing is released from here. The pull request goes through the full CI like any other,
# merges itself only once CI passed is green, and the release workflow then builds the
# binaries and releases the installer. A failing CI leaves the pull request open.
#
# A new major version is not bumped: the installer has to learn what changed (new settings,
# a new compose file or chart), so an issue is opened instead. Run it by hand ("Run
# workflow") with a version to catch up on a release.
#
# The pull request is opened with a token of the ansibleforms-release GitHub App rather than
# GITHUB_TOKEN, because a pull request opened with GITHUB_TOKEN starts no workflows and would
# never get its checks. It needs the variable RELEASE_APP_CLIENT_ID and the secret
# RELEASE_APP_PRIVATE_KEY in this repository.

on:
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'AnsibleForms version to move the installer to, e.g. 7.4.3'
        type: string
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  group: follow-app-release
  cancel-in-progress: false

jobs:
  bump:
    name: Open the version bump
    runs-on: ubuntu-latest
    steps:
      - name: Work out the version and the installer line
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RAW: ${{ github.event.client_payload.tag || inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW#v}"
          # final releases only: a release candidate gets no installer
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RAW' is not a release version (x.y.z)."; exit 1
          fi
          major="${version%%.*}"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/internal/version/version.go" \
            -H 'Accept: application/vnd.github.raw' \
            | sed -nE 's/^const App = "([0-9]+)\.[0-9]+\.[0-9]+"$/\1/p')"
          if ! [[ "$current" =~ ^[0-9]+$ ]]; then
            echo "::error::internal/version/version.go on main needs exactly one line const App = \"x.y.z\"."; exit 1
          fi
          base=""
          if [ "$major" = "$current" ]; then
            base=main
          elif gh api "repos/${GITHUB_REPOSITORY}/branches/release/${major}.x" >/dev/null 2>&1; then
            base="release/${major}.x"
          fi
          echo "AnsibleForms $version, installer major on main is $current, line: ${base:-none}"
          {
            echo "version=$version"
            echo "major=$major"
            echo "current=$current"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

      # A new major needs the installer moved by hand (new settings, a new compose file or
      # chart). Say so once, as an issue, instead of opening a bump that would only break
      # installations.
      - name: A new major version needs the installer moved by hand
        if: steps.target.outputs.base == '' && fromJSON(steps.target.outputs.major) > fromJSON(steps.target.outputs.current)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
          MAJOR: ${{ steps.target.outputs.major }}
          CURRENT: ${{ steps.target.outputs.current }}
        run: |
          set -euo pipefail
          title="Move the installer to AnsibleForms ${MAJOR}"
          if [ -n "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "The issue for AnsibleForms ${MAJOR} is already open."; exit 0
          fi
          gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "AnsibleForms ${VERSION} was released, a new major version. The installer is not bumped automatically across a major: read the app's upgrade notes, teach the installer what changed (settings, the compose file, the chart, the native layout), start a release/${CURRENT}.x line if ${CURRENT}.x keeps getting fixes, and move version.App in internal/version/version.go to ${VERSION}."

      - name: Nothing to follow
        if: steps.target.outputs.base == '' && fromJSON(steps.target.outputs.major) <= fromJSON(steps.target.outputs.current)
        run: echo "::notice::No installer line follows AnsibleForms ${{ steps.target.outputs.major }} any more, nothing to bump."

      - uses: actions/create-github-app-token@v3
        id: app
        if: steps.target.outputs.base != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: installer

      - uses: actions/checkout@v7
        if: steps.target.outputs.base != ''
        with:
          ref: ${{ steps.target.outputs.base }}
          token: ${{ steps.app.outputs.token }}

      - name: Move the default version
        id: bump
        if: steps.target.outputs.base != ''
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          version = os.environ["VERSION"]
          key = lambda s: tuple(int(x) for x in s.split("."))
          out = open(os.environ["GITHUB_OUTPUT"], "a")

          # version.App is the AnsibleForms version the installer installs by default, and the
          # installer's own version: exactly one line const App = "x.y.z", or nothing is touched
          version_path = "internal/version/version.go"
          source = open(version_path).read()
          line = re.compile(r'(?m)^const App = "(\d+\.\d+\.\d+)"$')
          found = line.findall(source)
          if len(found) != 1:
              sys.exit(f'::error::{version_path} needs exactly one line const App = "x.y.z", found {len(found)}.')
          now = found[0]
          if key(version) <= key(now):
              print(f"The installer already defaults to {now}, nothing to do for {version}.")
              out.write("skip=true\n")
              sys.exit(0)
          source, count = line.subn(f'const App = "{version}"', source)
          if count != 1:
              sys.exit(f"::error::{version_path} was not moved to {version}.")
          open(version_path, "w").write(source)

          log_path = "CHANGELOG.md"
          log = open(log_path).read()
          default_line = (f"- **Defaults to AnsibleForms {version}**: `install` and `upgrade` go to it unless `--version` says\n"
                          f"  otherwise. See the [{version} release notes](https://github.com/ansibleforms/ansibleforms/releases/tag/{version}).\n")
          # the installer changes made since the last release wait under "## Unreleased" :
          # they become this release's entry, with the default version line on top of what changed
          unreleased = re.search(r"(?s)^## Unreleased\n(.*?)(?=^## |\Z)", log, re.M)
          body = unreleased.group(1).strip("\n") + "\n" if unreleased else ""
          if "### Changed\n\n" in body:
              body = body.replace("### Changed\n\n", "### Changed\n\n" + default_line, 1)
          else:
              body = "### Changed\n\n" + default_line + ("\n" + body if body.strip() else "")
          entry = f"## Unreleased\n\n## {version}\n\nAnsibleForms {version}.\n\n{body}\n"
          if unreleased:
              log = log[:unreleased.start()] + entry + log[unreleased.end():]
          else:
              log = log.replace("# Changelog\n\n", "# Changelog\n\n" + entry, 1)
          open(log_path, "w").write(log)

          print(f"version.App {now} -> {version}")
          out.write(f"skip=false\nfrom={now}\n")
          PY

      - name: Open the pull request with auto-merge
        if: steps.target.outputs.base != '' && steps.bump.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          BASE: ${{ steps.target.outputs.base }}
          VERSION: ${{ steps.target.outputs.version }}
          FROM: ${{ steps.bump.outputs.from }}
        run: |
          set -euo pipefail
          branch="build/ansibleforms-${VERSION}"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is already open."; exit 0
          fi
          user_id="$(gh api "/users/${SLUG}[bot]" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${user_id}+${SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "build: default to AnsibleForms ${VERSION}" \
            -m "Move version.App, the AnsibleForms version the installer installs by default, from ${FROM} to ${VERSION}."
          git push --force origin "$branch"
          url="$(gh pr create --base "$BASE" --head "$branch" \
            --title "build: default to AnsibleForms ${VERSION}" \
            --body "AnsibleForms [${VERSION}](https://github.com/ansibleforms/ansibleforms/releases/tag/${VERSION}) was released. This moves \`version.App\` (\`internal/version/version.go\`), the AnsibleForms version the installer installs by default, from \`${FROM}\` to \`${VERSION}\`, and turns the changelog's Unreleased section into the ${VERSION} entry.

          Opened by the *Follow app release* workflow. It merges itself once **CI passed** is green, and the release workflow then builds the binaries and releases installer v${VERSION}. If CI fails, it stays open for a look.")"
          echo "Opened $url"
          gh pr merge "$url" --auto --squash
