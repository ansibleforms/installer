name: CI

# Checks every pull request and every push to main or a release/<major>.x line as a release
# would build it: the code is formatted (gofmt), go vet finds nothing, the tests pass, and the
# installer builds for Linux on amd64 and arm64 and prints the version of
# internal/version (version.App) back. A Dependabot bump of a Go module or an action has to pass it
# before it is merged.
#
# The release workflow waits for this one: once it finishes green on a push, a version.App
# that has no release yet is released.
#
# The main ruleset requires one check, CI passed, which passes only when every job did: a job
# added later is covered without changing the ruleset.

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Formatted
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not formatted with gofmt: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # version.App, the AnsibleForms version the installer installs by default, is read from
      # its one line exactly as the release workflow reads it, and the binary has to say it
      - name: Build
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^const App = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' internal/version/version.go)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::internal/version/version.go needs exactly one line const App = \"x.y.z\"."; exit 1
          fi
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "/tmp/ansibleforms-installer_linux_$arch" .
          done
          printed="$(/tmp/ansibleforms-installer_linux_amd64 version)"
          if [ "$printed" != "$version" ]; then
            echo "::error::The binary says '$printed', not $version."; exit 1
          fi
          echo "Built the installer of AnsibleForms $version"

  # The one check the ruleset requires, so a job added later is covered without
  # changing the ruleset. This passes only when every job did.
  passed:
    name: CI passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A CI job ended with '$result'."; exit 1; }
          done
