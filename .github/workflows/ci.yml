name: CI

# Checks every pull request and every push to main as a release would build it: the code is
# formatted (gofmt), go vet finds nothing, the tests pass, and the installer builds for Linux
# on amd64 and arm64. A Dependabot bump of a Go module or an action has to pass it before it
# is merged.
#
# The main ruleset requires one check, CI passed, which passes only when every job did: a job
# added later is covered without changing the ruleset.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Formatted
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not formatted with gofmt: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "/tmp/ansibleforms-installer_linux_$arch" .
          done

  # The one check the ruleset requires, so a job added later is covered without
  # changing the ruleset. This passes only when every job did.
  passed:
    name: CI passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A CI job ended with '$result'."; exit 1; }
          done
