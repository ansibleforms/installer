# An RTE alone on its own host, set up by hand from the docker repository of 7.2 : it reads
# and writes the AnsibleForms database itself (database mode) and registers its own runner.
services:
  rte:
    image: ghcr.io/ansibleforms/ansibleforms-rte-full:7
    container_name: af_rte
    restart: unless-stopped
    ports:
      - 8000:8000
    env_file:
      - ./.env
    environment:
      - PORT=8000
      - HTTPS=0
      - PYTHONPATH=/app/dist/persistent/python/lib
    volumes:
      - ./data:/app/dist/persistent
      - ./data/ssh:/home/node/.ssh
      - ./data/ansible/ansible.cfg:/etc/ansible/ansible.cfg
